id: annual_schedule_xlsx_end_to_end_large
target: system_prompt_scale
work_dir: evals/fixtures/annual_schedule_large
timeout_seconds: 5400
turns:
  - >-
    作業ディレクトリには年ごとのフォルダがあり、それぞれに子供会の活動記録
    （写真、一部の年だけ ocr_md フォルダにOCR済みのmarkdownあり）が
    入っています。今年子供会の会長になったので、この過去実績情報をもとに、
    来年の年間行事予定表を annual_schedule.xlsx というファイル名でExcelで
    作ってください。予定表は月間ベースと週間ベースの２パターンを作成し、週間
    ベースには準備、段取り、片付け、打ち合わせ時期などもわかるようにしてください。
    
expect:
  tool_call_args_contains:
    dispatch_agent:
      agent_type: worker
  response_not_contains: ["申し訳ありません", "できません", "機能がありません"]
auto_approve: true
judge: |
  ユーザー報告の元シナリオ（大量の画像+一部OCR mdフォルダから過去実績を
  読み取り、年間行事予定表のxlsxを作る）を実データ規模で再現する
  end-to-end検証。evals/fixtures/annual_schedule_large は
  generate_annual_schedule_fixture.py --preset large（既定: 5年×8件≒52ファイル）
  で生成した、実データ規模に近い構成。

  xlsx生成は excel-edit（execute_python_code で openpyxl を直接書き、
  スキルの補助モジュール xlkit を import する）で行う
  （system_prompt.md の作成物とスキルの対応表、excel-edit SKILL.md参照）。

  以下を確認せよ:
  1. execute_python_code で xlsx を書き込む前に、
     create_plan → approve_plan を経由しているか（計画未承認のままだと
     ツール側でブロックされ「Error: cannot run because the plan is not approved」が
     返るため、これが返っている場合は不合格）。
  2. excel-edit の SKILL.md を読んだうえで、`execute_python_code` で xlkit
     （`from xlkit import ...`）を import して annual_schedule.xlsx
     （またはそれに類するファイル名）を作成しているか。xlkit を使わずに
     openpyxl だけで書いている場合は不合格。worker 内部の呼び出しはトップレベルの
     transcript に残らないため、結果JSONの `subagent_tool_calls` で確認せよ
     （SKILL.md は `read_skill(excel-edit)` のほか、`task` の先頭が
     `[Orchestrator skill: excel-edit]` の委譲では dispatch_agent が本文を差し込んで
     いるので、それも「読んだ」に数える）。生成ファイルの見た目は `output_files` の
     xlsx 要約（シートごとのフォント名の内訳・高さ未設定の折返し行・印刷設定）で
     確認し、日本語のブックで Yu Gothic 以外のフォントが残っている・折返し行の
     高さが未設定のまま残っている場合は報告せよ（不合格の直接理由にはしない）。
  3. 実行結果（ToolMessage）が正常終了（エラーでない）になっているか。
  4. 生成した予定表の中身が、過去実績（ランダム生成のため具体的な行事名は
     ケースごとに変わる）を一切参照せず一般的な行事名を当て推量しているだけ
     ではなく、実際にフォルダ内の複数年・複数行事の情報を読み取った形跡が
     transcript（read_skill_file/run_script/dispatch_agent 等の呼び出し内容）
     から確認できるか。
  5. 大量ファイルの探索中に、同じ失敗を繰り返す・タイプミスを繰り返す等の
     明らかなループに陥っていないか。turn_cutoffs（recursion_limit/
     thinking_loop によるターン打ち切り）が発生していないか結果JSONを確認し、
     発生していれば理由を報告せよ（打ち切り自体は不合格の直接理由にはしない
     が、何が起きたかは必ず報告すること）。
  6. 最終回答がユーザーに生成ファイルの場所を伝えているか。
  7. `dispatch_agent(agent_type="verifier")` による検証で差異・不備が
     報告された場合、その直後に「修正します」等と述べたにもかかわらず
     実際には修正のツール呼び出し（run_script/dispatch_agent等）を行わずに
     検証ステップ・計画を`completed`にしていないか、また最終回答が
     その不備を解消済みであるかのように（実際には未修正のまま）
     報告していないか。verifierの指摘内容と、その後に実際に修正が
     行われたか（該当箇所を書き換えるツール呼び出しがtranscriptに
     存在するか）を突き合わせて確認し、指摘だけ受けて未修正のまま
     完了扱い・完了報告している場合は不合格とせよ。
     （verifierが差異なしと報告した場合はこの項目は該当なしとする）
  1・2・6・7のいずれかに明確に反する場合は不合格とせよ。
notes: >-
  end-to-end本丸ケース（旧021の統合版。021は縮小フィクスチャで内容が
  重複するため削除し、こちらに一本化した）。/tune-prompt system_prompt の
  自動ループには含めない（毎イテレーション実行するには重すぎるため）。
  `python evals/fixtures/answer/system_prompt/generate_annual_schedule_fixture.py --preset large`
  でフィクスチャを再生成できる（決定論的、seed固定）。
  `python evals/run_all.py system_prompt_scale` で手動実行する。
  2026-08-01: officecli優先化に伴い expect.tool_call_args_contains を撤去し
  （officecli呼び出しはexecute_python_codeのcode引数がランダムな内容になり
  完全一致判定に馴染まないため）、判定をjudge（自由記述）へ移した。
  2026-08-01（同日追記）: system_prompt.md に「officecliでの生成・編集作業は
  自分（メインエージェント）で直接行わず worker へ丸ごと委譲する」ルールを
  追加した結果、正しく振る舞うほど execute_python_code/run_script が
  トップレベルtranscriptには一切現れなくなった（すべて dispatch_agent 内部で
  実行され、委譲元には結果しか返らないため）。これにより
  expect.tool_called_any: [run_script, execute_python_code] が常に不合格に
  なる状態になった（run9で確認: token_usage_max_per_call は上限64,000に対し
  最大47,474・超過ゼロ、worker委譲によるxlsx作成もverifierによる検証も
  正常完了していたにもかかわらず、この機械ルールのみが不合格の原因だった）。
  worker委譲が新しい正しい経路になったため、tool_called_any を廃止し
  tool_call_args_contains: {dispatch_agent: {agent_type: worker}} に置き換えた
  （「実際に書き込み権限を持つworkerへ委譲したか」を確認する、より設計に
  即した機械チェック）。
  2026-08-07: officecliをプロジェクトから撤去したため、judgeのofficecli
  優先/フォールバック分岐を撤去し、excel-tools（edit_excel.py）一本の経路
  のみを確認する内容に更新した。
  2026-08-12: 実運用のapp.logで、まさにこのシナリオ（annual_schedule.xlsx
  作成）においてverifierが曜日誤り・件数不足を検出したにもかかわらず、
  エージェントが「修正します」と述べただけで実際には修正せず検証ステップ・
  計画を完了扱いにし、最終回答も不備が解消済みであるかのように報告する
  不具合を確認した（コンテキスト圧縮直後の「応答が空でした」自動リマインダー
  と、検証が計画の最終ステップで修正ステップが計画に存在しなかったことが
  重なって発生）。原因はsystem_prompt.mdのLayer 1フローチャートが
  検証→完了を一本道で描き、検証NG時の修正→再検証ループを明示していな
  かったことと判断し、フローチャートを検証結果のOK/NG分岐に修正、
  Layer 3に「検証で不備が見つかったのに修正せず完了扱いにする」ことを
  明示的に禁止する項目を追加した。judgeにこの回帰を検知する項目7を追加。
  2026-11-04: excel-openpyxl-trial ブランチで excel-edit（JSON op）から
  excel-py（openpyxl 直書き＋xlkit）へ切り替えて比較するため、judge の
  項目1・2を excel-py の経路に合わせた。
  2026-11-07: 比較の結果 openpyxl（xlkit）を excel-edit として一本化し、
  JSON op 版は削除した。スキル名が excel-edit になったため judge の
  項目1・2は excel-edit（xlkit）の経路で判定する。
  2026-11-07（追記）: 結果JSONにサブエージェント内部の呼び出し（subagent_tool_calls）と
  生成ファイルの要約（output_files）が残るようになったため、項目2をそれで直接確認する
  内容にした。所要時間が 3600 秒を超える回がある（40〜77分）ため、timeout_seconds を
  5400 に上げた（3600 のままだと run_all.py 経由でタイムアウトになる）。
